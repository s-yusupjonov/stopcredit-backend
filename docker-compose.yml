name: stopcredit

services:
  postgres:
    image: postgres:16-alpine
    container_name: stopcredit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-stopcredit}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    ports:
      # bound to loopback only: the database must not be reachable from the network
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-stopcredit}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # minio/minio was discontinued (Oct 2025) and bitnami/minio now needs a paid
    # subscription; bitnamilegacy/minio is the last free, still-pullable build.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: stopcredit-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  minio-data: