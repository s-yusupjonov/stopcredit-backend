server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stopcredit}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  jackson:
    default-property-inclusion: non_null

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:stopcredit-documents}

admin:
  default-username: ${ADMIN_USERNAME:admin}
  default-password: ${ADMIN_PASSWORD:changeme}

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

ldap:
  url: ${LDAP_URL:ldap://172.16.102.1:389}
  base: ${LDAP_BASE:DC=corp,DC=agrobank,DC=uz}
  user-search-base: ${LDAP_USER_SEARCH_BASE:}
  user-search-filter: ${LDAP_USER_SEARCH_FILTER:(sAMAccountName={0})}
  manager-dn: ${LDAP_MANAGER_DN:CN=davomat,OU=Services Users,OU=Priveleged Accounts,DC=corp,DC=agrobank,DC=uz}
  manager-password: ${LDAP_MANAGER_PASSWORD:Amazon12meta!$}

credit:
  review-deadline-days: ${CREDIT_REVIEW_DEADLINE_DAYS:3}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    uz.agrobank.stopcredit: INFO